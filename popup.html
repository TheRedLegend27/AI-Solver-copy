<!DOCTYPE html>
<html>
<head>
  <title>Study Assistant</title>
  <style>
    body {
      width: 300px;
      padding: 10px;
      font-family: Arial, sans-serif;
    }
    .toggle {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .form-group {
      margin-top: 10px;
    }
    input, select {
      width: 100%;
      padding: 5px;
      margin-top: 5px;
      box-sizing: border-box;
    }
    #status {
      margin-top: 10px;
      color: green;
    }
    button {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 8px 16px;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      font-size: 14px;
      margin: 4px 2px;
      cursor: pointer;
      border-radius: 4px;
    }
    .advanced-options {
      margin-top: 15px;
      border-top: 1px solid #ddd;
      padding-top: 10px;
    }
    .advanced-toggle {
      cursor: pointer;
      color: #2196F3;
      font-size: 14px;
    }
    .hidden {
      display: none;
    }
    .footer {
      margin-top: 15px;
      font-size: 12px;
      color: #666;
      text-align: center;
    }
  </style>
</head>
<body>
  <h2>Study Assistant</h2>
  <div class="toggle">
    <span>Enable Assistant</span>
    <input type="checkbox" id="enableAssistant">
  </div>
  <div class="form-group">
    <label for="apiKey">OpenAI API Key:</label>
    <input type="password" id="apiKey" placeholder="sk-...">
  </div>
  
  <div class="advanced-options">
    <div class="advanced-toggle" id="advancedToggle">+ Advanced Options</div>
    <div id="advancedSettings" class="hidden">
      <div class="form-group">
        <label for="modelChoice">AI Model:</label>
        <select id="modelChoice">
          <!-- <option value="gpt-3.5-turbo">GPT-3.5 Turbo (Faster)</option> -->
          <option value="gpt-4">GPT-4 (More Accurate)</option>
        </select>
      </div>
      <div class="form-group">
        <label for="delayBetweenQuestions">Delay Between Questions (ms):</label>
        <input type="number" id="delayBetweenQuestions" min="1000" max="20000" value="3000">
        <small>Higher values help avoid rate limiting.</small>
      </div>
    </div>
  </div>
  
  <button id="saveSettings">Save Settings</button>
  <div id="status"></div>
  
  <div class="footer">
    For educational purposes only
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
